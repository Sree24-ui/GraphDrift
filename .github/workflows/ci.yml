name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  accessibility:
    # axe against the real pages, with a seeded backend: empty tables would
    # pass the scan while proving nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.lock
      - name: Seed a fixture database and start the API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./a11y_fixture.db
        run: |
          python scripts/seed_ui_fixture.py
          python scripts/create_user.py --dev-seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/a11y-api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          cp .env.development.example .env.development
          npx playwright install --with-deps chromium
      - name: axe scan
        working-directory: frontend
        run: npm run test:a11y
